<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>위클리 플래너</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>
<div id="fallback-msg"></div>

<script>
  function showFallback(text) {
    var fallback = document.getElementById("fallback-msg");
    if (fallback) {
      fallback.style.display = "block";
      fallback.innerText = text;
    }
  }
  window.addEventListener("error", function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      showFallback("페이지를 불러오지 못했어요.\n인터넷 연결을 확인한 뒤 새로고침 해주세요.");
    }
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      showFallback("페이지를 불러오지 못했어요.\n인터넷 연결을 확인한 뒤 새로고침 해주세요.");
    }
  }, 4000);
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>

<!-- plain JS, no JSX: order matters, each depends on the previous -->
<script src="dateUtils.js"></script>
<script src="firestoreApi.js"></script>
<script src="useWeeklyTasks.js"></script>

<!-- JSX, compiled in-browser by Babel Standalone: order matters here too -->
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="AuthScreen.jsx"></script>
<script type="text/babel" src="WeeklyPlanner.jsx"></script>
</body>
</html>
