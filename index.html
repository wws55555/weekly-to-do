<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>위클리 플래너</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #EDEFEA;
    min-height: 100vh;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  #root {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  #fallback-msg {
    display: none;
    max-width: 640px;
    margin: 60px auto;
    padding: 20px 22px;
    background: #FBFBF7;
    border: 1px solid #DADFD5;
    border-radius: 10px;
    color: #AD5237;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback-msg"></div>

<script>
  function showFallback(text) {
    var fallback = document.getElementById("fallback-msg");
    if (fallback) {
      fallback.style.display = "block";
      fallback.innerText = text;
    }
  }
  window.addEventListener("error", function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      showFallback("페이지를 불러오지 못했어요.\n인터넷 연결을 확인한 뒤 새로고침 해주세요.");
    }
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.childElementCount === 0) {
      showFallback("페이지를 불러오지 못했어요.\n인터넷 연결을 확인한 뒤 새로고침 해주세요.");
    }
  }, 4000);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ---------- minimal inline icons ---------- */
function Icon({ children, size = 15, strokeWidth = 2, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></Icon>;
const Star = ({ fill = "none", ...p }) => <Icon {...p}><polygon fill={fill} points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></Icon>;
const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;

/* ---------- date helpers ---------- */
const DAY_LABELS = ["월", "화", "수", "목", "금", "토", "일"];
const DAY_LABELS_FULL = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setHours(0, 0, 0, 0);
  d.setDate(diff);
  return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function toKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function formatMD(date) { return `${date.getMonth() + 1}.${date.getDate()}`; }
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

function WeeklyPlanner() {
  const [weekOffset, setWeekOffset] = useState(0);
  const [tasks, setTasks] = useState([]);
  const [inputText, setInputText] = useState("");
  const [connectionOk, setConnectionOk] = useState(true);
  const [loading, setLoading] = useState(true);
  const [selectedDay, setSelectedDay] = useState(null);
  const [authUid, setAuthUid] = useState(null);
  const dbRef = useRef(null);

  const today = useMemo(() => new Date(), []);
  const monday = useMemo(() => addDays(getMonday(today), weekOffset * 7), [today, weekOffset]);
  const weekDates = useMemo(() => Array.from({ length: 7 }, (_, i) => addDays(monday, i)), [monday]);
  const weekKey = useMemo(() => toKey(monday), [monday]);
  const todayIndexInWeek = useMemo(() => weekDates.findIndex((d) => isSameDay(d, today)), [weekDates, today]);

  // sign in anonymously once
  useEffect(() => {
    if (!window.firebase || !firebaseReady) return;
    const auth = firebase.auth();
    dbRef.current = firebase.firestore();
    const unsub = auth.onAuthStateChanged((user) => {
      if (user) {
        setAuthUid(user.uid);
      } else {
        auth.signInAnonymously().catch((e) => {
          setConnectionOk(false);
          showFallback(
            "로그인에 실패했어요: " + e.message +
            "\nFirebase 콘솔에서 Authentication > 로그인 방법 > 익명 을 사용 설정했는지 확인해주세요."
          );
        });
      }
    });
    return () => unsub();
  }, []);

  // subscribe to this week's document, live
  useEffect(() => {
    if (!authUid || !dbRef.current) return;
    setLoading(true);
    setSelectedDay(todayIndexInWeek >= 0 ? todayIndexInWeek : 0);
    const unsub = dbRef.current.collection("weeklyPlanner").doc(weekKey).onSnapshot(
      (docSnap) => {
        const data = docSnap.exists ? docSnap.data() : null;
        setTasks(data && Array.isArray(data.tasks) ? data.tasks : []);
        setConnectionOk(true);
        setLoading(false);
      },
      (err) => {
        console.error(err);
        setConnectionOk(false);
        setLoading(false);
      }
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [weekKey, authUid]);

  const persist = useCallback((next) => {
    setTasks(next); // optimistic UI update; onSnapshot will confirm
    if (!dbRef.current) return;
    dbRef.current.collection("weeklyPlanner").doc(weekKey)
      .set({ tasks: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .catch((e) => {
        console.error(e);
        setConnectionOk(false);
      });
  }, [weekKey]);

  const addTask = () => {
    const text = inputText.trim();
    if (!text || selectedDay === null) return;
    const next = [...tasks, { id: uid(), day: selectedDay, text, done: false, important: false, createdAt: Date.now() }];
    persist(next);
    setInputText("");
  };
  const toggleDone = (id) => persist(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
  const toggleImportant = (id) => persist(tasks.map((t) => (t.id === id ? { ...t, important: !t.important } : t)));
  const removeTask = (id) => persist(tasks.filter((t) => t.id !== id));
  const clearDay = (dayIdx) => {
    if (tasks.filter((t) => t.day === dayIdx).length === 0) return;
    if (window.confirm("이 요일의 할 일을 모두 지울까요? (모두에게 함께 삭제됩니다)")) {
      persist(tasks.filter((t) => t.day !== dayIdx));
    }
  };

  const tasksFor = (dayIdx) =>
    tasks.filter((t) => t.day === dayIdx).sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.important !== b.important) return a.important ? -1 : 1;
      return a.createdAt - b.createdAt;
    });
  const progressFor = (dayIdx) => {
    const list = tasks.filter((t) => t.day === dayIdx);
    const done = list.filter((t) => t.done).length;
    return { done, total: list.length };
  };
  const weekProgress = useMemo(() => {
    const total = tasks.length;
    const done = tasks.filter((t) => t.done).length;
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }, [tasks]);

  const rangeLabel = `${formatMD(weekDates[0])} – ${formatMD(weekDates[6])}`;
  const isThisWeek = weekOffset === 0;
  const activeList = selectedDay === null ? [] : tasksFor(selectedDay);
  const activeProgress = selectedDay === null ? { done: 0, total: 0 } : progressFor(selectedDay);

  return (
    <div className="wk-root">
      <div className="wk-header">
        <div>
          <h1 className="wk-title">위클리 플래너</h1>
          <p className="wk-subtitle">
            <Users size={12} style={{ verticalAlign: "-2px", marginRight: 4 }} />
            함께 보는 주간 할 일 목록
          </p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
          <div className="wk-nav">
            <button className="wk-nav-btn" onClick={() => setWeekOffset((w) => w - 1)} aria-label="이전 주"><ChevronLeft size={16} /></button>
            <span className="wk-range">{rangeLabel}</span>
            <button className="wk-nav-btn" onClick={() => setWeekOffset((w) => w + 1)} aria-label="다음 주"><ChevronRight size={16} /></button>
            <button className="wk-today-btn" onClick={() => setWeekOffset(0)} disabled={isThisWeek}>이번 주</button>
          </div>
          <div className="wk-stamp">
            <div className="wk-stamp-ring" style={{ background: `conic-gradient(#3B6255 ${weekProgress.pct * 3.6}deg, #DADFD5 0deg)` }}>
              <div className="wk-stamp-inner">{weekProgress.pct}%</div>
            </div>
            <div className="wk-stamp-text">이번 주 완료<br /><b>{weekProgress.done}</b> / {weekProgress.total}</div>
          </div>
        </div>
      </div>

      {loading ? (
        <div className="wk-loading">불러오는 중…</div>
      ) : (
        <>
          <div className="wk-strip">
            {weekDates.map((date, idx) => {
              const isToday = isSameDay(date, today);
              const isSelected = selectedDay === idx;
              const { done, total } = progressFor(idx);
              const hasContent = total > 0;
              const allComplete = hasContent && done === total;
              const dotClass = total === 0 ? "" : allComplete ? "all-done" : "has-tasks";
              return (
                <button
                  key={idx}
                  className={`wk-day-btn${isSelected ? " is-selected" : ""}${isToday ? " is-today" : ""}${hasContent ? " has-content" : ""}${allComplete ? " all-complete" : ""}`}
                  onClick={() => setSelectedDay(idx)}
                >
                  {isToday && <span className="wk-today-mark" />}
                  {hasContent && <span className={`wk-day-badge${allComplete ? " all-complete" : ""}`}>{total}</span>}
                  <span className="wk-day-btn-name">{DAY_LABELS[idx]}</span>
                  <span className="wk-day-btn-date">{formatMD(date)}</span>
                  <span className={`wk-day-dot ${dotClass}`} />
                </button>
              );
            })}
          </div>

          {selectedDay !== null && (
            <div className={`wk-panel${isSameDay(weekDates[selectedDay], today) ? " is-today" : ""}`}>
              <div className="wk-panel-head">
                <div className="wk-tab-bg" />
                <div className="wk-panel-head-content">
                  <span>
                    <span className="wk-panel-day">{DAY_LABELS_FULL[selectedDay]}</span>
                    <span className="wk-panel-date">{formatMD(weekDates[selectedDay])}</span>
                  </span>
                  <span>
                    <span className="wk-panel-count">{activeProgress.total > 0 ? `${activeProgress.done}/${activeProgress.total}` : ""}</span>
                    <button className="wk-clear-btn" onClick={() => clearDay(selectedDay)} aria-label="이 요일 전체 삭제"><Trash2 size={13} /></button>
                  </span>
                </div>
              </div>

              <div className="wk-progress-track">
                <div className="wk-progress-fill" style={{ width: `${activeProgress.total ? (activeProgress.done / activeProgress.total) * 100 : 0}%` }} />
              </div>

              <div className="wk-list">
                {activeList.length === 0 && <div className="wk-empty">할 일이 없어요</div>}
                {activeList.map((t) => (
                  <div key={t.id} className="wk-item">
                    <button className={`wk-check${t.done ? " is-done" : ""}`} onClick={() => toggleDone(t.id)} aria-label={t.done ? "완료 취소" : "완료로 표시"}>
                      {t.done && <Check size={12} strokeWidth={3} />}
                    </button>
                    <span className={`wk-item-text${t.done ? " is-done" : ""}`}>{t.text}</span>
                    <button className={`wk-star-btn${t.important ? " is-active" : ""}`} onClick={() => toggleImportant(t.id)} aria-label="중요 표시">
                      <Star size={14} fill={t.important ? "currentColor" : "none"} />
                    </button>
                    <button className="wk-del-btn" onClick={() => removeTask(t.id)} aria-label="삭제"><X size={14} /></button>
                  </div>
                ))}
              </div>

              <div className="wk-add-row">
                <input
                  className="wk-add-input"
                  placeholder="할 일을 입력하세요"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") addTask(); }}
                />
                <button className="wk-add-btn" onClick={addTask} aria-label="할 일 추가"><Plus size={15} /></button>
              </div>
            </div>
          )}
        </>
      )}

      {!connectionOk && <div className="wk-warning">서버와 연결이 원활하지 않아요. 변경사항이 저장되지 않을 수 있어요.</div>}
    </div>
  );
}

if (firebaseReady) {
  try {
    ReactDOM.createRoot(document.getElementById("root")).render(<WeeklyPlanner />);
  } catch (e) {
    showFallback("실행 중 오류가 발생했습니다: " + e.message);
  }
}
</script>

<style>
  .wk-root {
    --bg: #EDEFEA; --surface: #FBFBF7; --surface-soft: #F3F4EF;
    --ink: #1F2A24; --ink-soft: #5B655E; --ink-faint: #96A196;
    --accent: #3B6255; --accent-soft: #E4ECE7;
    --gold: #C98A25; --gold-soft: #F3E3C4;
    --line: #DADFD5; --danger: #AD5237;
    color: var(--ink);
  }
  .wk-root *, .wk-root *::before, .wk-root *::after { box-sizing: border-box; }
  .wk-root button { font-family: inherit; cursor: pointer; }
  .wk-root input { font-family: inherit; }
  .wk-root button:focus-visible, .wk-root input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wk-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .wk-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; margin: 0; }
  .wk-subtitle { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; display: flex; align-items: center; }

  .wk-nav { display: flex; align-items: center; gap: 10px; }
  .wk-nav-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--ink); transition: background .15s ease, border-color .15s ease; }
  .wk-nav-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .wk-range { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); min-width: 96px; text-align: center; }
  .wk-today-btn { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); background: transparent; margin-left: 4px; }
  .wk-today-btn:disabled { opacity: .35; cursor: default; }
  .wk-today-btn:not(:disabled):hover { background: var(--accent-soft); }

  .wk-stamp { display: flex; align-items: center; gap: 10px; }
  .wk-stamp-ring { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .wk-stamp-inner { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; }
  .wk-stamp-text { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
  .wk-stamp-text b { color: var(--ink); font-weight: 600; }

  .wk-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 18px; }
  .wk-day-btn { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: border-color .15s ease, background .15s ease, transform .1s ease; }
  .wk-day-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .wk-day-btn.is-today { border-color: var(--gold); }
  .wk-day-btn.is-selected { background: var(--accent); border-color: var(--accent); }
  .wk-day-btn.is-selected.is-today { border-color: var(--gold); }
  .wk-day-btn-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
  .wk-day-btn-date { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--ink-soft); }
  .wk-day-btn.is-selected .wk-day-btn-name, .wk-day-btn.is-selected .wk-day-btn-date { color: #fff; }

  .wk-day-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .wk-day-dot.has-tasks { background: var(--gold); }
  .wk-day-dot.all-done { background: var(--accent); }
  .wk-day-btn.is-selected .wk-day-dot.has-tasks { background: var(--gold-soft); }
  .wk-day-btn.is-selected .wk-day-dot.all-done { background: #fff; }
  .wk-day-btn.is-selected .wk-day-dot:not(.has-tasks):not(.all-done) { background: rgba(255,255,255,.35); }

  .wk-today-mark { position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
  .wk-day-btn.is-selected .wk-today-mark { background: var(--gold-soft); }

  .wk-day-btn.has-content { border-color: var(--gold); background: var(--gold-soft); }
  .wk-day-btn.has-content.all-complete { border-color: var(--accent); background: var(--accent-soft); }
  .wk-day-btn.has-content.is-selected { background: var(--accent); border-color: var(--accent); }
  .wk-day-badge { position: absolute; top: -6px; left: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--gold); color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
  .wk-day-badge.all-complete { background: var(--accent); }
  .wk-day-btn.is-selected .wk-day-badge { border-color: var(--surface); }

  .wk-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
